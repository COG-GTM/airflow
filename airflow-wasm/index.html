<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airflow in the browser</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem 1rem;
        background: #017cee;
        color: #fff;
      }
      header h1 {
        font-size: 1rem;
        margin: 0;
        white-space: nowrap;
      }
      header .grow {
        flex: 1;
      }
      button {
        font: inherit;
      }
      #boot {
        padding: 1rem;
        overflow: auto;
      }
      #log {
        margin: 0.5rem 0 0;
        font-size: 0.8rem;
        max-height: 40vh;
        overflow: auto;
        white-space: pre-wrap;
      }
      #ui {
        flex: 1;
        border: 0;
        width: 100%;
      }
      #ui:not([src]) {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Apache Airflow &mdash; WebAssembly</h1>
      <span id="status">starting&hellip;</span>
      <span class="grow"></span>
      <span>scheduler: <span id="heartbeat">waiting</span></span>
      <button id="reset" type="button">Reset database</button>
    </header>
    <section id="boot">
      <strong>Nothing here runs on a server.</strong> Python, the Airflow API, the scheduler, the
      worker and the Postgres database all run in this tab.
      <pre id="log"></pre>
    </section>
    <iframe id="ui" title="Airflow UI"></iframe>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
